server:
  port: ${PORT:8080}
spring:
  application:
    name: briefly-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:briefly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://morningnews.coders.kr}
  news:
    naver:
      client-id: ${NAVER_API_HUB_CLIENT_ID:${NAVER_CLIENT_ID:}}
      client-secret: ${NAVER_API_HUB_CLIENT_SECRET:${NAVER_CLIENT_SECRET:}}
      base-url: ${NAVER_API_HUB_BASE_URL:https://naverapihub.apigw.ntruss.com}
    gdelt:
      enabled: ${GDELT_NEWS_ENABLED:true}
      api-key: ${GDELT_CLOUD_API_KEY:}
      base-url: ${GDELT_CLOUD_BASE_URL:https://gdeltcloud.com}
      minimum-article-count: ${GDELT_MINIMUM_ARTICLE_COUNT:3}
      minimum-significance: ${GDELT_MINIMUM_SIGNIFICANCE:0.45}
      read-timeout-seconds: ${GDELT_READ_TIMEOUT_SECONDS:30}
    official-rss:
      enabled: ${OFFICIAL_NEWS_RSS_ENABLED:true}
      read-timeout-seconds: ${OFFICIAL_NEWS_RSS_READ_TIMEOUT_SECONDS:20}
      extra-feeds: ${OFFICIAL_NEWS_EXTRA_RSS_FEEDS:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Use the quality model for both source comparison and editorial wording
      # unless an environment override is explicitly supplied.
      candidate-model: ${OPENAI_CANDIDATE_MODEL:${OPENAI_MODEL:gpt-5.6-sol}}
      connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:90}
      editor:
        enabled: ${NEWS_EDITORIAL_PASS_ENABLED:false}
        model: ${OPENAI_EDITOR_MODEL:gpt-5.6-sol}
        read-timeout-seconds: ${OPENAI_EDITOR_READ_TIMEOUT_SECONDS:180}
  push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:https://morningnews.coders.kr}
    public-url: ${PUBLIC_APP_URL:https://morningnews.coders.kr}
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
  pipeline:
    enabled: ${NEWS_PIPELINE_ENABLED:false}
    generate-on-startup: ${NEWS_GENERATE_ON_STARTUP:false}
    # 새벽 매시 수집 후 06:00 최종화를 거쳐 07:30 정시 발송한다.
    collection-cron: ${NEWS_COLLECTION_CRON:${NEWS_GENERATION_CRON:0 0 0-5 * * *}}
    finalization-cron: ${NEWS_FINALIZATION_CRON:0 0 6 * * *}
    finalization-time: "${NEWS_FINALIZATION_TIME:06:00}"
    max-candidates-per-category: ${NEWS_MAX_CANDIDATES_PER_CATEGORY:14}
    max-articles-per-category: ${NEWS_MAX_ARTICLES_PER_CATEGORY:160}
    search-max-pages: ${NEWS_SEARCH_MAX_PAGES:5}
    max-ai-candidates: ${NEWS_MAX_AI_CANDIDATES:120}
    ai-concurrency: ${NEWS_AI_CONCURRENCY:4}
    max-stories-per-category: ${NEWS_MAX_STORIES_PER_CATEGORY:3}
    economy-finance-max-stories-per-category: ${NEWS_ECONOMY_FINANCE_MAX_STORIES_PER_CATEGORY:3}
    economy-finance-max-stories-total: ${NEWS_ECONOMY_FINANCE_MAX_STORIES_TOTAL:6}
    max-stories: ${NEWS_MAX_STORIES:15}
    target-stories: ${NEWS_TARGET_STORIES:15}
    minimum-importance-score: ${NEWS_MINIMUM_IMPORTANCE_SCORE:65}
    minimum-delivery-stories: ${NEWS_MINIMUM_DELIVERY_STORIES:10}
    minimum-delivery-categories: ${NEWS_MINIMUM_DELIVERY_CATEGORIES:5}
    required-categories: ${NEWS_REQUIRED_CATEGORIES:SPORTS,ESPORTS}
    admin-token: ${BRIEFING_ADMIN_TOKEN:}
    previous-admin-token: ${BRIEFING_ADMIN_TOKEN_PREVIOUS:}
    require-human-approval: ${REQUIRE_HUMAN_APPROVAL:false}
  security:
    trust-coders-user-header: ${TRUST_CODERS_USER_HEADER:false}
    public-write-limit-per-minute: ${PUBLIC_WRITE_LIMIT_PER_MINUTE:30}
    admin-limit-per-minute: ${ADMIN_LIMIT_PER_MINUTE:60}
  backup:
    enabled: ${BACKUP_ENABLED:false}
    cron: ${BACKUP_CRON:0 15 4 * * *}
    bucket: ${BACKUP_STORAGE_BUCKET:}
    endpoint: ${BACKUP_STORAGE_ENDPOINT:}
    access-key: ${BACKUP_STORAGE_ACCESS_KEY:}
    secret-key: ${BACKUP_STORAGE_SECRET_KEY:}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}

