name: Morning briefing operations

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 06:00 and 06:45 Asia/Seoul.
    # The second job keeps the free service warm and dispatches at 07:30.
    - cron: "0 21 * * *"
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: run
        type: choice
        options:
          - generate
          - dispatch
          - run
          - test-push
          - status

permissions:
  contents: read

concurrency:
  group: morning-briefing-production
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Choose operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$REQUESTED_OPERATION"
          elif [[ "$SCHEDULE" == "0 21 * * *" ]]; then
            operation="generate"
          else
            operation="run"
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Keep service warm until 07:30 KST
        if: github.event_name == 'schedule' && github.event.schedule == '45 21 * * *'
        shell: bash
        run: |
          target="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 07:30:00" +%s)"
          while true; do
            now="$(date +%s)"
            remaining=$((target - now))
            if (( remaining <= 0 )); then break; fi
            curl --silent --show-error --max-time 30 \
              --retry 3 --retry-all-errors \
              "https://morningnews.coders.kr/api/push/public-key" >/dev/null || true
            if (( remaining > 60 )); then sleep 60; else sleep "$remaining"; fi
          done

      - name: Wake backend API
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            config="$(curl --fail-with-body --silent --show-error \
              --max-time 45 \
              "https://morningnews.coders.kr/api/push/public-key" 2>/dev/null || true)"
            if jq -e '.enabled == true' <<< "$config" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend API did not become ready within the wake-up window" >&2
          exit 1

      - name: Wake service and run morning operation
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          test -n "$ADMIN_TOKEN"
          if [[ "$OPERATION" == "status" ]]; then
            status="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              "https://morningnews.coders.kr/api/admin/briefings/subscriptions" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN")"
            active="$(jq -r '.activeSubscriptions' <<< "$status")"
            changed_at="$(jq -r '.lastChangedAt // "기록 없음"' <<< "$status")"
            reason="$(jq -r '.lastChangeReason // "기록 없음"' <<< "$status")"
            {
              echo "### 활성 알림 기기 현황"
              echo ""
              echo "- 활성 기기: **${active}대**"
              echo "- 마지막 수 변경: ${changed_at}"
              echo "- 변경 사유: ${reason}"
              echo ""
              echo "> 사용자 화면에는 표시되지 않는 운영자용 집계입니다."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OPERATION" == "test-push" ]]; then
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/test-push" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"expectedActiveSubscriptions":1}'
          else
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 720 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/$OPERATION" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN"
          fi

      - name: Wait for AI briefing generation
        if: steps.operation.outputs.operation == 'generate' || steps.operation.outputs.operation == 'run'
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
        run: |
          for attempt in $(seq 1 72); do
            status="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              "https://morningnews.coders.kr/api/admin/briefings/status" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN")"
            ready="$(jq -r '.productionReady' <<< "$status")"
            state="$(jq -r '.generationJob.state' <<< "$status")"
            if [[ "$ready" == "true" ]]; then exit 0; fi
            if [[ "$state" == "FAILED" ]]; then
              jq -r '.generationJob.error' <<< "$status" >&2
              exit 1
            fi
            sleep 10
          done
          echo "AI briefing generation did not finish within 12 minutes" >&2
          exit 1

      - name: Dispatch after recovered generation
        if: steps.operation.outputs.operation == 'run'
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 90 \
            -X POST "https://morningnews.coders.kr/api/admin/briefings/dispatch" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN"
