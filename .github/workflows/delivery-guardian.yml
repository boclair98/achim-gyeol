name: 07:30 delivery guardian

on:
  schedule:
    # Redundant off-peak starts from 03:37 to 06:07 KST. A newer start
    # replaces the older guardian and keeps the sleeping backend awake until
    # the exact 07:30 dispatch. Multiple starts are safe because recovery is
    # persisted and deduplicated per edition and device.
    # UTC Sunday–Thursday corresponds to KST Monday–Friday mornings.
    - cron: "37 18 * * 0-4"
    - cron: "7 19 * * 0-4"
    - cron: "37 19 * * 0-4"
    - cron: "7 20 * * 0-4"
    - cron: "37 20 * * 0-4"
    - cron: "7 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-delivery-guardian
  cancel-in-progress: true

jobs:
  calendar:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.calendar.outputs.allowed }}
    steps:
      - id: calendar
        run: |
          if [[ "$(TZ=Asia/Seoul date +%u)" -le 5 ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
  guard:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Keep backend awake until 07:30 KST
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 07:30:00" +%s)"
          stale_cutoff="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 13:30:00" +%s)"
          now="$(date +%s)"
          if (( now >= stale_cutoff )); then
            echo "Guardian started outside the recovery window; persisted delivery status will be checked."
            exit 0
          fi
          while (( now < target )); do
            curl --fail --silent --show-error --max-time 45 \
              --retry 3 --retry-all-errors \
              "https://morningnews.coders.kr/api/push/public-key" >/dev/null || true
            remaining=$((target - now))
            if (( remaining > 45 )); then sleep 45; else sleep "$remaining"; fi
            now="$(date +%s)"
          done

      - name: Dispatch and recover only missed devices
        id: delivery
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          briefing_date="$(TZ=Asia/Seoul date +%F)"

          time="$(TZ=Asia/Seoul date +%H:%M)"
          endpoint=""
          if [[ "$time" < "08:00" && ! "$time" < "07:30" ]]; then endpoint="dispatch"; fi
          if [[ "$time" < "13:30" && ! "$time" < "08:00" ]]; then endpoint="catch-up"; fi
          if [[ -n "$endpoint" ]]; then
            curl --fail --silent --show-error --max-time 180 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/$endpoint" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" >/dev/null || true
          fi
          snapshot="$(curl --fail --silent --show-error --retry 2 --max-time 45 \
            "https://morningnews.coders.kr/api/admin/briefings/delivery-status" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN")"
          jq -e --arg date "$briefing_date" '.date == $date and (.targetDevices | type == "number")' <<< "$snapshot" >/dev/null
          active="$(jq -r '.targetDevices' <<< "$snapshot")"
          total_delivered="$(jq -r '.providerAccepted' <<< "$snapshot")"
          failed="$(jq -r '.failed' <<< "$snapshot")"
          due="$(jq -r '.pending' <<< "$snapshot")"
          ready="$(jq -r '.newsReady' <<< "$snapshot")"
          status="DISPATCH_CONFIRMED"
          if [[ "$ready" != "true" ]]; then status="NEWS_NOT_READY";
          elif (( failed + due > 0 )); then status="UNDELIVERED_REMAIN";
          elif (( active == 0 )); then status="NO_TARGETS"; fi
          echo "date=$briefing_date" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "delivered=$total_delivered" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### 07:30 보호 발송"
            echo ""
            echo "- 기준일: ${briefing_date}"
            echo "- 뉴스 준비: ${ready}"
            echo "- 첫 준비 시각: $(jq -r '.firstNewsReadyAt // "기록 없음"' <<< "$snapshot")"
            echo "- 마지막 뉴스 갱신: $(jq -r '.newsUpdatedAt // "없음"' <<< "$snapshot")"
            echo "- 첫 푸시 접수: $(jq -r '.firstAcceptedAt // "없음"' <<< "$snapshot")"
            echo "- 발송 대상: ${active}대"
            echo "- 푸시 제공자 접수: ${total_delivered}대"
            echo "- 미시도·대기: ${due}대"
            echo "- 최종 실패: ${failed}대"
            echo "- 복구 상태: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ready" != "true" ]] || (( failed + due > 0 )); then exit 1; fi

      - name: Report guardian result on Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          BRIEFING_DATE: ${{ steps.delivery.outputs.date }}
          ACTIVE: ${{ steps.delivery.outputs.active }}
          DUE: ${{ steps.delivery.outputs.due }}
          DELIVERED: ${{ steps.delivery.outputs.delivered }}
          FAILED: ${{ steps.delivery.outputs.failed }}
          RECOVERY_STATUS: ${{ steps.delivery.outputs.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          if [[ "$JOB_STATUS" == "success" ]]; then icon="✅"; else icon="🚨"; fi
          message="${icon} 아침결 07:30 보호 발송

          기준일: ${BRIEFING_DATE:-확인 불가}
          작업 결과: ${JOB_STATUS}
          발송 대상: ${ACTIVE:-확인 불가}
          푸시 제공자 접수: ${DELIVERED:-확인 불가}
          미시도·대기: ${DUE:-확인 불가}
          실패: ${FAILED:-확인 불가}
          복구 상태: ${RECOVERY_STATUS:-실행 실패}
          작업 확인: ${RUN_URL}"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "protect_content=true")"
          jq -e '.ok == true' <<< "$response" >/dev/null
