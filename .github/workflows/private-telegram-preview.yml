name: Private Telegram briefing preview

on:
  push:
    branches:
      - codex/private-telegram-preview-20260821

permissions:
  contents: read

jobs:
  send-private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send today's briefing to the operator only
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "\$TELEGRAM_BOT_TOKEN" || -z "\$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram private delivery is not configured." >&2
            exit 1
          fi

          briefing_json="\$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 45 \
            "https://morningnews.coders.kr/api/briefings/today")"

          if [[ "\$(jq -r '.productionReady // false' <<< "\$briefing_json")" != "true" ]]; then
            echo "Today's briefing is not production-ready." >&2
            exit 1
          fi

          send_html() {
            local text="\$1"
            local response
            response="\$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -X POST "https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=\${TELEGRAM_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=\${text}" \
              --data-urlencode "disable_web_page_preview=false" \
              --data-urlencode "protect_content=true")"
            jq -e '.ok == true' <<< "\$response" >/dev/null
          }

          header="\$(jq -r '
            def esc: tostring | @html;
            "<b>아침결 · 오늘 뉴스 미리보기</b>\n\n" +
            (.dateLabel | esc) + " · " +
            ((.stories | length) | tostring) + "건 · " +
            (.readMinutes | tostring) + "분\n" +
            (.lead | esc) + "\n\n" +
            "<b>분야</b> " + (([.stories[].category] | unique | join(" · ")) | esc) + "\n\n" +
            "<a href=\"https://morningnews.coders.kr/briefing/\">웹에서 현재 템플릿으로 전체 보기</a>\n" +
            "<i>이 미리보기는 본인 채팅으로만 발송했습니다.</i>"
          ' <<< "\$briefing_json")"
          send_html "\$header"

          stories_json="\$(jq -c '.stories' <<< "\$briefing_json")"
          for start in 0 3 6; do
            chunk="\$(jq -c --argjson start "\$start" '.[$start:($start + 3)]' <<< "\$stories_json")"
            if [[ "\$(jq 'length' <<< "\$chunk")" == "0" ]]; then
              continue
            fi

            message="\$(jq -r '
              def esc: tostring | @html;
              map(
                "<b>[" + (.category | esc) + "] " + (.title | esc) + "</b>\n" +
                (.oneLineSummary | esc) + "\n\n" +
                "<b>이해하기</b> " + ((.plainExplanation // .summary) | esc) + "\n\n" +
                "<b>왜 중요한가</b> " + (.whyItMatters | esc) + "\n" +
                (if ((.whatToWatch // "") | tostring) != "" then "<b>다음 확인</b> " + (.whatToWatch | esc) + "\n" else "" end) +
                (if ((.sources[0].url // "") | tostring) != "" then "<a href=\"" + (.sources[0].url | esc) + "\">원문 보기</a>" else "" end)
              ) | join("\n\n")
            ' <<< "\$chunk")"
            send_html "\$message"
          done

          echo "Private Telegram briefing preview delivered to the configured operator chat."
