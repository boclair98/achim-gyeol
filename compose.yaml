services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: briefly
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d briefly"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports: ["8080:8080"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/briefly
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      BACKEND_URL: http://backend:8080
    depends_on: [backend]

volumes:
  postgres_data:
